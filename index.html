<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>47 Cloud</title>
    <meta name="description" content="A secure, personal cloud storage platform.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1 class="logo">47 Cloud</h1>
            <nav id="auth-nav">
                <button id="logout-btn" class="hidden">Sign Out</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="auth-section">
            <h2>Account Access</h2>
            <form id="auth-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
                
                <div class="button-group">
                    <button type="submit" id="signin-btn" class="primary">Sign In</button>
                    <button type="button" id="signup-btn">Create Account</button>
                </div>
                <p id="auth-message" class="message"></p>
            </form>
        </section>

        <section id="storage-section" class="hidden">
            <h2>File Management</h2>
            <div class="upload-zone">
                <input type="file" id="file-input" hidden>
                <button type="button" id="upload-btn" class="primary">Select and Upload File</button>
                <p id="upload-status"></p>
            </div>

            <h3>Stored Files</h3>
            <table id="file-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="file-list">
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms and Conditions</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
