<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>47 Cloud</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login View -->
    <section id="auth-section" class="auth-container hidden">
        <div class="auth-card">
            <h1 class="logo">47 Cloud</h1>
            <p class="subtitle">Secure personal storage.</p>
            <form id="auth-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
                <div class="button-group">
                    <button type="submit" id="signin-btn" class="primary">Sign In</button>
                    <button type="button" id="signup-btn">Create Account</button>
                </div>
                <p id="auth-message" class="message"></p>
            </form>
        </div>
    </section>

    <!-- Dashboard View -->
    <div id="dashboard-section" class="dashboard-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">47 Cloud</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="all">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item" data-view="files">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    All Files
                </a>
                <a href="#" class="nav-item" data-view="favorites">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    Favorites
                </a>
                <a href="#" class="nav-item" data-view="shared">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Shared
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="storage-info">
                    <p class="storage-label">Storage Used</p>
                    <p class="storage-amount" id="storage-used">0 MB</p>
                    <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
                </div>
                <button id="logout-btn" class="logout-btn">Sign Out</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-controls">
                    <div class="search-bar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search files..." id="search-input">
                    </div>
                    <select id="sort-select" class="sort-select">
                        <option value="date-desc">Date (Newest)</option>
                        <option value="date-asc">Date (Oldest)</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="size-desc">Size (Largest)</option>
                        <option value="size-asc">Size (Smallest)</option>
                    </select>
                </div>
                <div class="topbar-actions">
                    <button id="upload-btn" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Upload File
                    </button>
                    <input type="file" id="file-input" hidden>
                </div>
            </header>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid">
                <!-- Storage Overview -->
                <section class="card overview-card">
                    <h2>Storage Overview</h2>
                    <div class="overview-stats" id="overview-stats">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <!-- Quick Actions -->
                <section class="card actions-card">
                    <h2>Quick Actions</h2>
                    <div class="actions-list">
                        <button id="quick-upload" class="action-btn">Upload Files</button>
                        <button class="action-btn disabled">Create Folder</button>
                        <button class="action-btn disabled">Share Link</button>
                    </div>
                </section>

                <!-- All Files Table -->
                <section class="card files-card full-width">
                    <div class="card-header">
                        <h2 id="current-view-title">All Files</h2>
                        <span class="file-count" id="file-count">0 files</span>
                    </div>
                    
                    <!-- Filter Tabs -->
                    <div class="filter-tabs" id="filter-tabs">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="documents">Documents</button>
                        <button class="filter-btn" data-filter="images">Images</button>
                        <button class="filter-btn" data-filter="videos">Videos</button>
                        <button class="filter-btn" data-filter="others">Others</button>
                    </div>

                    <div class="table-container">
                        <table id="files-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Size</th>
                                    <th>Modified</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="file-list">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js"></script>
        <!-- Custom Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <button class="context-item" data-action="rename">Rename</button>
        <button class="context-item" data-action="download">Download</button>
        <button class="context-item" data-action="share">Copy Share Link</button>
        <div class="context-divider"></div>
        <button class="context-item danger" data-action="delete">Delete</button>
    </div>
</body>
</html>
